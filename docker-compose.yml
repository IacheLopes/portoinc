# ============================================================
#  Porto Inc. - Sistema de Compras e Almoxarifado
#  Ambiente de DESENVOLVIMENTO
#
#  Cada container esta limitado a 1 GB de RAM e 1 nucleo de CPU
#  para simular exatamente o servidor real.
# ============================================================

services:

  # ---------- BANCO DE DADOS ----------
  db:
    image: postgres:17-alpine
    container_name: portoink-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Evita recriar o banco a cada subida
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      # --- Ajuste fino para caber em 1 GB ---
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=30
      - -c
      - random_page_cost=1.1
    volumes:
      - portoink_dados:/var/lib/postgresql/data
    ports:
      # Exposto para voce conseguir abrir no DBeaver/pgAdmin
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks: [portoink]

  # ---------- BACKEND (API) ----------
  api:
    build:
      context: ./backend
      target: dev
    container_name: portoink-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      # O V8 nao enxerga o limite do container: precisamos avisar
      NODE_OPTIONS: --max-old-space-size=640
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public&connection_limit=10
      DATABASE_URL_TESTE: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/portoink_test?schema=public
      # Banco descartavel usado pelo Prisma ao gerar migracoes.
      # Separado do de testes: usar o mesmo sujava o banco de testes.
      SHADOW_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/portoink_sombra?schema=public
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      # O endereco que entra nos LINKS que saem do sistema — o
      # portal do fornecedor no convite de cotacao, por exemplo.
      # `localhost` funciona no computador de quem desenvolve e NAO
      # abre no celular de ninguem: la, localhost e o proprio
      # telefone. Em producao, o dominio da empresa.
      URL_PUBLICA: ${URL_PUBLICA:-http://localhost:5173}
      # --- Adaptadores de integracao (trocar aqui liga a integracao real) ---
      WHATSAPP_ADAPTER: ${WHATSAPP_ADAPTER}
      WHATSAPP_SESSAO_DIR: /app/sessao-whatsapp
      # Trava de seguranca: com "true", so sai mensagem para numero que
      # estiver na lista de autorizados.
      WHATSAPP_MODO_TESTE: ${WHATSAPP_MODO_TESTE:-true}
      # O E-MAIL FALTAVA AQUI, e isso foi defeito ate 11/10/2026.
      #
      # As duas linhas existiam no `.env` desde que o e-mail nasceu,
      # mas nao eram repassadas ao container: o app caia no padrao do
      # `ambiente.ts` e ninguem via por que. Quem editasse o `.env`
      # para ligar o e-mail no dia do lancamento nao veria nada
      # acontecer, e nao haveria mensagem nenhuma explicando.
      #
      # Achado porque ele perguntou "se eu lancasse hoje, ja
      # funcionaria?" — e a resposta honesta exigiu conferir.
      EMAIL_ADAPTER: ${EMAIL_ADAPTER:-mock}
      # Trava de seguranca: com "true", so sai e-mail para endereco
      # que estiver na lista de autorizados.
      EMAIL_MODO_TESTE: ${EMAIL_MODO_TESTE:-true}
      EMAIL_API_TOKEN: ${EMAIL_API_TOKEN:-}
      EMAIL_REMETENTE: ${EMAIL_REMETENTE:-}
      FISCAL_ADAPTER: ${FISCAL_ADAPTER}
      PAGAMENTO_ADAPTER: ${PAGAMENTO_ADAPTER}
      # Necessario no Windows para o hot-reload enxergar as alteracoes
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/testes:/app/testes
      # So leitura: o `npm` de dentro lia a versao congelada na
      # imagem e anunciava 0.40.0 com o projeto em 0.56.0. A tela
      # sempre mostrou a certa, que vem de `Layout.tsx`.
      - ./backend/package.json:/app/package.json:ro
      - portoink_arquivos:/app/arquivos
      # Sessao do WhatsApp (Baileys). Volume proprio para o reinicio do
      # container NAO pedir o QR de novo. Contem credenciais: nunca vai
      # para o git e nunca aparece em log.
      - portoink_whatsapp:/app/sessao-whatsapp
      # Volume anonimo: impede que o bind-mount apague o node_modules do container
      - /app/node_modules
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks: [portoink]

  # ---------- FRONTEND (React) ----------
  web:
    build:
      context: ./frontend
      target: dev
    container_name: portoink-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      CHOKIDAR_USEPOLLING: "true"
      # O ENDERECO PUBLICO ENTRA NA PAGINA, nao so nos links.
      #
      # A miniatura que o WhatsApp mostra vem das marcas `og:` do
      # HTML, e `og:image` precisa de endereco ABSOLUTO — o
      # rastreador le a pagina de fora, sem saber de onde ela veio.
      # O Vite troca `%VITE_URL_PUBLICA%` por este valor.
      VITE_URL_PUBLICA: ${URL_PUBLICA:-http://localhost:5173}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      # O ajuste dos testes de tela tambem vale sem reconstruir a imagem.
      - ./frontend/vitest.config.ts:/app/vitest.config.ts
      # E o do SERVIDOR tambem. Faltava: em 10/10/2026 mudei o
      # `allowedHosts` para o link do convite abrir pelo nome, e
      # passei um tempo achando que a mudanca nao fazia efeito —
      # o container seguia com a configuracao que veio na imagem.
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/public:/app/public
      - /app/node_modules
    ports:
      - "5173:5173"
      # A MESMA TELA TAMBEM NA PORTA 80, para o celular.
      #
      # O link do convite de cotacao viaja pelo WhatsApp, e com
      # IP + PORTA o WhatsApp pinta so o IP de azul: o resto vira
      # texto, e o que o dedo abre e `http://192.168.1.109` — sem
      # porta, sem caminho, sem cotacao nenhuma.
      #
      # Sem a porta no endereco, ele transforma a linha inteira em
      # link. `localhost:5173` continua funcionando igual.
      - "80:5173"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks: [portoink]

volumes:
  portoink_whatsapp:
    name: portoink_whatsapp
  portoink_dados:
    name: portoink_dados
  portoink_arquivos:
    name: portoink_arquivos

networks:
  portoink:
    name: portoink
