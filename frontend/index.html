<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- minimum-scale=1: o dedo pode APROXIMAR o quanto quiser, mas nao
             consegue mais afastar abaixo de 100% e deixar a pagina pequena
             no meio da tela com faixa vazia do lado. Sem isso, todo
             navegador de celular permite afastar por padrao.
    
             Nao entra `maximum-scale` nem `user-scalable=no`: quem precisa
             aumentar para ler TEM de conseguir. Bloquear isso e das piores
             faltas de acessibilidade que uma tela pode ter. -->
        <!-- `viewport-fit=cover` manda a pagina ocupar a tela inteira do iPhone,
         inclusive atras do entalhe e da barrinha de baixo. Sem ele sobram duas
         faixas brancas; com ele, a pagina precisa se defender sozinha — e e o
         que `env(safe-area-inset-*)` faz em painel.css. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover"
    />
    <!-- A previa do WhatsApp prefere `description` a `og:description`.
         As duas dizem a mesma coisa de proposito: o que esta frase
         responde e "posso clicar?", para quem recebeu um link de um
         remetente que nao conhece. -->
    <meta
      name="description"
      content="Responda ao pedido de cotação pelo link. Não precisa de cadastro nem de senha."
    />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Porto Inc. | Compras e Almoxarifado</title>

    <!-- A MINIATURA QUE APARECE QUANDO O LINK VIAJA
         ========================================================
         O convite de cotacao vai por WhatsApp, e um link cru, sem
         imagem nem titulo, parece mensagem suspeita — justamente o
         que o fornecedor nao pode achar.

         COMO FUNCIONA, e por que ainda nao aparece: quem monta a
         miniatura e o SERVIDOR do WhatsApp, nao o celular. Ele
         BUSCA o endereco pela internet e le estas marcas. Com o
         sistema num IP da rede local, os servidores do WhatsApp
         nao alcancam a pagina, e nenhuma miniatura e possivel —
         por mais marca que se escreva aqui.

         Entao isto e preparo, nao conserto: no dia em que a Porto
         Inc. tiver dominio proprio, a miniatura passa a aparecer
         sozinha, sem mexer em nada.
         ======================================================== -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Porto Inc." />
    <meta property="og:title" content="Porto Inc. — Compras e Almoxarifado" />
    <meta
      property="og:description"
      content="Responda ao pedido de cotação pelo link. Não precisa de cadastro nem de senha."
    />
    <meta property="og:image" content="%VITE_URL_PUBLICA%/link-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="%VITE_URL_PUBLICA%/" />

    <!-- O WhatsApp le as duas familias de marca; manter as duas
         evita depender de qual delas o aplicativo olhou primeiro. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Porto Inc. — Compras e Almoxarifado" />
    <meta
      name="twitter:description"
      content="Responda ao pedido de cotação pelo link. Não precisa de cadastro nem de senha."
    />
    <meta name="twitter:image" content="%VITE_URL_PUBLICA%/link-preview.png" />

    <!-- O tema guardado entra ANTES de a página desenhar. Sem isto
         ela pinta clara e só depois vira escura: um flash branco a
         cada carregamento. Por ser antes do React, fica aqui. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('portoink:tema') === 'escuro') {
            document.documentElement.setAttribute('data-tema', 'escuro');
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute('content', '#07141f');
          }
        } catch (e) {
          /* Janela anônima ou armazenamento bloqueado: abre no claro. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
